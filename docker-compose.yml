services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel_user}
      DB_PASSWORD: ${DB_PASSWORD:-laravel_password}
    working_dir: /var/www
    volumes:
      - public-data:/var/www/public
      - storage-data:/var/www/storage
      - ./.env:/var/www/.env
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: laravel-web
    restart: unless-stopped
    tty: true
    volumes:
      - public-data:/var/www/public
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  # MySQL Database
  db:
    image: mysql:9.0
    container_name: laravel-db
    restart: unless-stopped
    tty: true
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_password}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel-pma
    restart: unless-stopped
    tty: true
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      ARBITRARY: 1
    depends_on:
      - db
    networks:
      - laravel-network

  # Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-worker
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel_user}
      DB_PASSWORD: ${DB_PASSWORD:-laravel_password}
    command: php artisan queue:work --tries=3 --timeout=360
    volumes:
      - storage-data:/var/www/storage
      - ./.env:/var/www/.env
    depends_on:
      - db
      - app
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  public-data:
    driver: local
  storage-data:
    driver: local
